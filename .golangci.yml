version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - wsl_v5

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (github.com/thadeu/ndb/internal/fs.File).Close

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
