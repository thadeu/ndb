name: publish

# The SDK packages of a release, on their registries: the gems ndb and
# ndb-rails on rubygems.org, and @thadeu/ndb on npm. The jobs run at the
# same time. There are no tests here: CI tested the release commit, and
# scripts/release.sh pushes the tag only when that CI run passed.

on:
  push:
    tags: ['v*']
  # Run by hand to finish a release whose push stopped halfway (a version
  # that is already on the registry is skipped).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One release at a time, never cancelled halfway (a gem or a package can be
# pushed only once): a newer tag waits, and only the newest one waiting
# runs.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  gems:
    name: gems (ndb, ndb-rails)
    runs-on: ubuntu-latest

    env:
      GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Check the versions match the tag
        if: github.event_name == 'push'
        run: |
          test "v$(ruby -Isdk/ruby/lib -rndb/version -e 'puts Ndb::VERSION')" = "$GITHUB_REF_NAME"
          test "v$(ruby -Isdk/rails/lib -rndb/rails/version -e 'puts Ndb::Rails::VERSION')" = "$GITHUB_REF_NAME"

      - name: Build
        run: |
          (cd sdk/ruby && gem build ndb.gemspec)
          (cd sdk/rails && gem build ndb-rails.gemspec)

      - name: Configure RubyGems credentials (trusted publishing)
        if: ${{ env.GEM_HOST_API_KEY == '' }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0
        with:
          trusted-publisher: true

      # A version that is already on rubygems.org is skipped, so a re-run
      # finishes a release that stopped halfway.
      - name: "Push ndb (first: ndb-rails depends on it)"
        working-directory: sdk/ruby
        shell: bash
        run: gem push ndb-*.gem 2>&1 | tee push.log || grep -q "Repushing of gem versions is not allowed" push.log

      - name: Push ndb-rails
        working-directory: sdk/rails
        shell: bash
        run: gem push ndb-rails-*.gem 2>&1 | tee push.log || grep -q "Repushing of gem versions is not allowed" push.log

  npm:
    name: npm (@thadeu/ndb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/ts/package.json
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml

      - name: Check the version matches the tag
        if: github.event_name == 'push'
        working-directory: sdk/ts
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install
        working-directory: sdk/ts
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: sdk/ts
        run: pnpm build

      # A version that is already on npm is skipped, so a re-run finishes a
      # release that stopped halfway.
      - name: Publish
        working-directory: sdk/ts
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            unset NODE_AUTH_TOKEN
          fi

          version="$(node -p "require('./package.json').version")"

          if npm view "@thadeu/ndb@$version" version >/dev/null 2>&1; then
            echo "@thadeu/ndb@$version is already on npm: skipped"

            exit 0
          fi

          npm publish --provenance --access public
