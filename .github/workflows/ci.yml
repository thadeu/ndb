name: ci

# The one place with tests: every push to main and every pull request.
# scripts/release.sh waits for this run on the release commit before it
# pushes the tag, so release.yml and publish.yml do not test again.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the run in
# progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest

    # The streams parity test runs the cases of spec/streams against a real
    # Redis too (TestStreamCasesOnRedis).
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CI runs one plain pass with -short and no race detector: it only
      # checks that everything passes. The heavy tests (kills, crash loops,
      # 257 collections) skip with -short; they run local with make test,
      # make race and make bench.
      - name: Test daemon
        env:
          NDB_REDIS_ADDR: 127.0.0.1:6379
        run: go test -short -timeout 600s ./...

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test -short -timeout 300s ./...

      - name: Test Go SDK (ndbredis)
        working-directory: sdk/go/ndbredis
        env:
          NDB_REDIS_ADDR: 127.0.0.1:6379
        run: go test -short -timeout 300s ./...

  ruby:
    name: ruby (ndb, ndb-rails)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/ruby

      - name: Test ndb
        working-directory: sdk/ruby
        run: bundle exec rake test

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/rails

      - name: Test ndb-rails
        working-directory: sdk/rails
        run: bundle exec rake test

  ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/ts/package.json
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml

      - name: Install
        working-directory: sdk/ts
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: sdk/ts
        run: pnpm lint

      - name: Typecheck
        working-directory: sdk/ts
        run: pnpm typecheck

      - name: Test
        working-directory: sdk/ts
        run: pnpm test

      - name: Build
        working-directory: sdk/ts
        run: pnpm build

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh
