name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the run in
# progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest

    # The streams parity test runs the cases of spec/streams against a real
    # Redis too (TestStreamCasesOnRedis).
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test daemon
        env:
          NDB_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -p 2 -parallel=2 -timeout 300s ./...

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test -race -p 2 -parallel=2 -timeout 300s ./...

  ruby:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        gem: [ruby, rails]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/${{ matrix.gem }}

      - name: Test sdk/${{ matrix.gem }}
        working-directory: sdk/${{ matrix.gem }}
        run: bundle exec rake test

  ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/ts/package.json
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml

      - name: Install
        working-directory: sdk/ts
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: sdk/ts
        run: pnpm lint

      - name: Typecheck
        working-directory: sdk/ts
        run: pnpm typecheck

      - name: Test
        working-directory: sdk/ts
        run: pnpm test

      - name: Build
        working-directory: sdk/ts
        run: pnpm build

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh

  # The install tests download the released v0.1.0 binary, not the one in this
  # commit. They test the scripts, not the code.
  install-container:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Tools
        run: apt-get update && apt-get install -y curl ca-certificates

      - uses: actions/checkout@v4

      - name: Install
        env:
          NDB_VERSION: "0.1.0"
        run: sh install.sh

      - name: Run
        run: ndb -version

      - name: Uninstall
        run: |
          sh uninstall.sh
          test ! -e /usr/local/bin/ndb

  install-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        env:
          NDB_VERSION: "0.1.0"
          NDB_INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh

      - name: Run
        run: ${{ runner.temp }}/bin/ndb -version

      - name: Uninstall
        env:
          NDB_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh uninstall.sh
          test ! -e "$NDB_INSTALL_DIR/ndb"

  install-systemd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install with systemd
        env:
          NDB_VERSION: "0.1.0"
        run: sudo --preserve-env=NDB_VERSION sh install.sh --systemd

      - name: Daemon answers
        run: |
          systemctl is-active ndb
          sudo curl -fsS --unix-socket /run/ndb/ndb.sock http://ndb/health

      - name: Keeps the config on a second run
        env:
          NDB_VERSION: "0.1.0"
        run: |
          echo "# mine" | sudo tee -a /etc/ndb/ndb.yml
          sudo --preserve-env=NDB_VERSION sh install.sh --systemd
          grep -q "# mine" /etc/ndb/ndb.yml

      - name: Uninstall keeps the data
        run: |
          sudo sh uninstall.sh --systemd
          test -d /var/lib/ndb
          test -f /etc/ndb/ndb.yml
          test ! -e /etc/systemd/system/ndb.service

      - name: Purge
        run: |
          sudo sh uninstall.sh --systemd --purge
          test ! -e /var/lib/ndb
