name: ci

# The one place with tests: every push to main and every pull request.
# When the tests pass on a commit of main that has a tag v* (the commit
# "release: X.Y.Z" of make tag), the last jobs run the release: release.yml
# (binaries, console, Go tags), ghcr.yml (images) and publish.yml (gems,
# npm), at the same time. So a release is tested once, and make tag does
# not wait.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the run in
# progress.
# A push or pull request cancels the older run of its branch: only the
# newest commit needs its tests. A release commit ("release: X.Y.Z") has a
# group of its own, so no push cancels it: its run publishes, and a release
# cut in the middle cannot be fixed (a gem or a package version is pushed
# only once). Two releases do not mix: release.yml, ghcr.yml and
# publish.yml run one at a time, in order.
concurrency:
  group: ${{ startsWith(github.event.head_commit.message, 'release: ') && format('ci-release-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, 'release: ') }}

jobs:
  go:
    runs-on: ubuntu-latest

    # The streams parity test runs the cases of spec/streams against a real
    # Redis too (TestStreamCasesOnRedis).
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # CI runs one plain pass with -short and no race detector: it only
      # checks that everything passes. The heavy tests (kills, crash loops,
      # 257 collections) skip with -short; they run local with make test,
      # make race and make bench.
      - name: Test daemon
        env:
          NDB_REDIS_ADDR: 127.0.0.1:6379
        run: go test -short -timeout 600s ./...

      - name: Test Go SDK
        working-directory: sdk/go
        run: go test -short -timeout 300s ./...

      - name: Test Go SDK (ndbredis)
        working-directory: sdk/go/ndbredis
        env:
          NDB_REDIS_ADDR: 127.0.0.1:6379
        run: go test -short -timeout 300s ./...

  ruby:
    name: ruby (ndb, ndb-rails)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/ruby

      - name: Test ndb
        working-directory: sdk/ruby
        run: bundle exec rake test

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/rails

      - name: Test ndb-rails
        working-directory: sdk/rails
        run: bundle exec rake test

  ts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/ts/package.json
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdk/ts/pnpm-lock.yaml

      - name: Install
        working-directory: sdk/ts
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: sdk/ts
        run: pnpm lint

      - name: Typecheck
        working-directory: sdk/ts
        run: pnpm typecheck

      - name: Test
        working-directory: sdk/ts
        run: pnpm test

      - name: Build
        working-directory: sdk/ts
        run: pnpm build

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck install.sh uninstall.sh

  # The release tag of this commit, when it has one. make tag pushes main
  # and the tag together, so the tag is there when the tests end.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, ruby, ts, shellcheck]
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.find.outputs.tag }}

    steps:
      - name: Find the tag v* of the commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # make tag makes a light tag: its ref points at the commit.
          tag="$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v" --paginate --jq '.[] | select(.object.sha == "${{ github.sha }}") | .ref' | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          echo "tag: ${tag:-none}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit

  ghcr:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/ghcr.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  publish:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
