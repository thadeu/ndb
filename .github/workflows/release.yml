name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -p 2 -parallel=2 -timeout 300s ./...

      - name: Build
        run: |
          mkdir dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ndb-${GITHUB_REF_NAME}-${os}-${arch}"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o "dist/$name/ndb" ./cmd/ndb

            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

      - name: Tag the Go SDK
        run: |
          git tag "sdk/go/${GITHUB_REF_NAME}" "$GITHUB_SHA"
          git push origin "sdk/go/${GITHUB_REF_NAME}"

  console:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Test
        working-directory: console
        run: |
          mkdir -p /tmp/ndb-console-test
          (cd .. && go build -o /tmp/ndb-console-test/ndb ./cmd/ndb)

          bun install --frozen-lockfile
          bun run typecheck
          nice bun test

      - name: Build
        working-directory: console
        run: |
          bun run client

          mkdir -p release

          for target in linux-x64:linux-amd64 linux-arm64:linux-arm64 darwin-x64:darwin-amd64 darwin-arm64:darwin-arm64; do
            bun_target="${target%%:*}"
            suffix="${target#*:}"
            name="ndb-ui-${GITHUB_REF_NAME}-${suffix}"

            mkdir "release/$name"

            bun build --compile --minify --target="bun-${bun_target}" src/main.ts --outfile "release/$name/ndb-ui"

            cp ../LICENSE README.md "release/$name/"
            tar -C release -czf "release/$name.tar.gz" "$name"
            rm -rf "release/$name"
          done

          (cd release && sha256sum *.tar.gz > ndb-ui-checksums.txt)

      - name: Publish
        working-directory: console
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
