name: release

# The GitHub release of a tag: the daemon binaries and the tags of the Go
# modules. The images are in ghcr.yml and the SDK packages in publish.yml.
# There are no Go tests here: CI calls this workflow only after its tests
# passed on the release commit. The ndb-ui binaries are added to the same
# release by thadeu/ndb-cloud (see cloud.yml).

on:
  # Called by CI (ci.yml) when the tests passed on a commit with a tag v*.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

  # Run by hand: the tag must exist.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag (vX.Y.Z)
        type: string
        required: true

env:
  TAG: ${{ inputs.tag }}

permissions:
  contents: write


# One release at a time, never cancelled halfway (a gem or a package can be
# pushed only once): a newer tag waits, and only the newest one waiting
# runs.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: ndb binaries, GitHub Release, Go tags
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ndb-${TAG}-${os}-${arch}"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG#v}" \
              -o "dist/$name/ndb" ./cmd/ndb

            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -rf "dist/$name"
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --generate-notes --verify-tag

      # Each Go module of the repo gets a tag of its folder on the release
      # commit (sdk/go/vX.Y.Z, sdk/go/ndbredis/vX.Y.Z), so go get finds it.
      # release.sh already set the Go SDK version that ndbredis needs.
      - name: Tag the Go modules
        run: |
          sha="$(git rev-parse "${TAG}^{commit}")"

          for module in sdk/go sdk/go/ndbredis; do
            git tag "${module}/${TAG}" "$sha"
            git push origin "${module}/${TAG}"
          done
