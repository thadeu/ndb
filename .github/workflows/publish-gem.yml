name: publish-gem

on:
  push:
    tags:
      - "v*"
  # Run by hand to finish a release whose gem push stopped halfway.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/ruby

      - name: Check versions match the tag
        if: github.event_name == 'push'
        run: |
          test "v$(ruby -Isdk/ruby/lib -rndb/version -e 'puts Ndb::VERSION')" = "$GITHUB_REF_NAME"
          test "v$(ruby -Isdk/rails/lib -rndb/rails/version -e 'puts Ndb::Rails::VERSION')" = "$GITHUB_REF_NAME"

      - name: Test ndb
        working-directory: sdk/ruby
        run: bundle exec rake test

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: sdk/rails

      - name: Test ndb-rails
        working-directory: sdk/rails
        run: bundle exec rake test

      - name: Build
        run: |
          (cd sdk/ruby && gem build ndb.gemspec)
          (cd sdk/rails && gem build ndb-rails.gemspec)

      - name: Configure RubyGems credentials (trusted publishing)
        if: ${{ env.GEM_HOST_API_KEY == '' }}
        uses: rubygems/configure-rubygems-credentials@v2.1.0
        with:
          trusted-publisher: true

      # A version that is already on rubygems.org is skipped, so a re-run
      # finishes a release that stopped halfway.
      - name: "Push ndb (first, ndb-rails depends on it)"
        working-directory: sdk/ruby
        run: gem push ndb-*.gem 2>&1 | tee push.log || grep -q "Repushing of gem versions is not allowed" push.log

      - name: Push ndb-rails
        working-directory: sdk/rails
        run: gem push ndb-rails-*.gem 2>&1 | tee push.log || grep -q "Repushing of gem versions is not allowed" push.log
