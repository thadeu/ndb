name: engine

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "spec/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - run: make race

      - run: make fuzz-smoke
