name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'brand/**'
      - 'install.sh'
      - 'uninstall.sh'
      - '.github/workflows/docs.yml'
  # Build again after a release, so the version pill shows the new tag.
  workflow_run:
    workflows: [Release]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# One deploy at a time: a newer run cancels the one in progress.
concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs-site/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install
        working-directory: docs-site
        run: pnpm install --frozen-lockfile

      - name: Resolve latest release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName // empty')"
          echo "Latest release tag: ${TAG:-<none>}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: docs-site
        env:
          DOCS_VERSION: ${{ steps.version.outputs.tag }}
          DOCS_URL: https://ndb.clowk.in
        run: pnpm docs:build

      # wrangler pages deploy does not create a missing project; create it once.
      - name: Ensure the Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ndb-docs --production-branch=main
          workingDirectory: '.'
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/.vitepress/dist --project-name=ndb-docs --branch=main --commit-dirty=true
          workingDirectory: '.'
