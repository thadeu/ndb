# /etc/wireguard/wg0.conf on the db VM (10.10.0.1). Template: make the keys with
#   wg genkey | tee private.key | wg pubkey > public.key
[Interface]
Address = 10.10.0.1/24
ListenPort = 51820
PrivateKey = <db-vm-private-key>

[Peer]
# apps VM
PublicKey = <apps-vm-public-key>
AllowedIPs = 10.10.0.2/32
