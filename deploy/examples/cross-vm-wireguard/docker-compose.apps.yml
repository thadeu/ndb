# apps VM. The apps reach ndb on the db VM through WireGuard.
#
#   docker compose -f docker-compose.apps.yml up --build -d
#
# Build context is the repo root, as in ../single-vm. The apps are the ones of
# the single-vm example; they read NDB_URL and NDB_TOKEN (the SDKs send the
# token on TCP). Run with: NDB_TOKEN=$(ssh db-vm cat /etc/ndb/token) docker compose ...
name: ndb-apps

x-ndb-url: &ndb_url tcp://ndb.internal:7070

services:
  go:
    build:
      context: ../../..
      dockerfile: deploy/examples/single-vm/apps/go/Dockerfile
    restart: unless-stopped
    environment:
      NDB_URL: *ndb_url
      NDB_TOKEN: ${NDB_TOKEN:?set NDB_TOKEN}
    extra_hosts:
      # Replace with private DNS (ndb.internal -> 10.10.0.1) when you have it.
      - "ndb.internal:10.10.0.1"

  node:
    build:
      context: ../../..
      dockerfile: deploy/examples/single-vm/apps/node/Dockerfile
    restart: unless-stopped
    environment:
      NDB_URL: *ndb_url
      NDB_TOKEN: ${NDB_TOKEN:?set NDB_TOKEN}
    extra_hosts:
      - "ndb.internal:10.10.0.1"

  ruby:
    build:
      context: ../../..
      dockerfile: deploy/examples/single-vm/apps/ruby/Dockerfile
    restart: unless-stopped
    environment:
      NDB_URL: *ndb_url
      NDB_TOKEN: ${NDB_TOKEN:?set NDB_TOKEN}
    extra_hosts:
      - "ndb.internal:10.10.0.1"
