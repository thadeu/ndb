# db VM firewall (nftables). Port 7070 is open on wg0 only; WireGuard's UDP
# port is open on the public interface. Merge this into your own ruleset.
table inet ndb_filter {
  chain input {
    type filter hook input priority 0; policy accept;

    # WireGuard handshake from the apps VM.
    udp dport 51820 accept

    # ndb: only through the tunnel.
    iifname "wg0" tcp dport 7070 accept
    tcp dport 7070 drop
  }
}
