<svg xmlns="http://www.w3.org/2000/svg" viewBox="6.000 0.000 188.000 196.000" role="img" aria-label="ndb"><title>ndb</title><style>
  /* part: the whole bowl bobs a little */
  .bob { animation: ndb-bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  /* part: steam rises and fades, one wisp after the other */
  .steam { animation: ndb-steam 2.8s ease-in-out infinite; opacity: 0; }
  .steam-2 { animation-delay: 0.9s; }
  .steam-3 { animation-delay: 1.8s; }

  /* part: noodles sway, the magenta one last */
  .noodle { animation: ndb-sway 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .noodle-2 { animation-delay: 0.3s; }
  .noodle-3 { animation-delay: 0.6s; }

  /* part: eyes blink, cheeks glow */
  .eyes { animation: ndb-blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
  .cheek { animation: ndb-glow 3.2s ease-in-out infinite; }

  @keyframes ndb-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes ndb-steam { 0% { opacity: 0; transform: translateY(8px); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
  @keyframes ndb-sway { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
  @keyframes ndb-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  @keyframes ndb-glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.8; } }

  @media (prefers-reduced-motion: reduce) {
    .bob, .steam, .noodle, .eyes, .cheek { animation: none; }
    .steam { opacity: 1; }
  }
</style><path class="steam steam-1" d="M78 12q-6 7 0 14q6 7 0 14" fill="none" stroke="#C9C9D1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="steam steam-2" d="M100 6q-6 7 0 14q6 7 0 14" fill="none" stroke="#C9C9D1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="steam steam-3" d="M122 12q-6 7 0 14q6 7 0 14" fill="none" stroke="#C9C9D1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="bob"><path d="M28 112C28 76 60 56 100 56C140 56 172 76 172 112Z" fill="#F6D58E" stroke="#0B0B0F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path class="noodle noodle-1" d="M62.00 76.00L64.14 76.84L66.29 77.56L68.43 78.03L70.57 78.20L72.71 78.03L74.86 77.56L77.00 76.84L79.14 76.00L81.29 75.16L83.43 74.44L85.57 73.97L87.71 73.80L89.86 73.97L92.00 74.44L94.14 75.16L96.29 76.00L98.43 76.84L100.57 77.56L102.71 78.03L104.86 78.20L107.00 78.03L109.14 77.56L111.29 76.84L113.43 76.00L115.57 75.16L117.71 74.44L119.86 73.97L122.00 73.80" fill="none" stroke="#0B0B0F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path class="noodle noodle-2" d="M52.00 90.00L54.64 91.04L57.29 91.88L59.93 92.34L62.57 92.34L65.21 91.88L67.86 91.04L70.50 90.00L73.14 88.96L75.79 88.12L78.43 87.66L81.07 87.66L83.71 88.12L86.36 88.96L89.00 90.00L91.64 91.04L94.29 91.88L96.93 92.34L99.57 92.34L102.21 91.88L104.86 91.04L107.50 90.00L110.14 88.96L112.79 88.12L115.43 87.66L118.07 87.66L120.71 88.12L123.36 88.96L126.00 90.00" fill="none" stroke="#0B0B0F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path class="noodle noodle-3" d="M48.00 103.00L51.21 104.04L54.43 104.88L57.64 105.34L60.86 105.34L64.07 104.88L67.29 104.04L70.50 103.00L73.71 101.96L76.93 101.12L80.14 100.66L83.36 100.66L86.57 101.12L89.79 101.96L93.00 103.00L96.21 104.04L99.43 104.88L102.64 105.34L105.86 105.34L109.07 104.88L112.29 104.04L115.50 103.00L118.71 101.96L121.93 101.12L125.14 100.66L128.36 100.66L131