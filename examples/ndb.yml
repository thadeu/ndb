# One config for every example. Paths are relative to this file.
# The socket lives in /tmp: a unix socket path must stay under 104 bytes on macOS.
data_dir: ./.data

listen:
  unix: /tmp/ndb-examples.sock

collections:
  # region users
  users:
    indexes: [plan]
    unique: [email]
  # endregion users

  # region app_logs
  app_logs:
    write: direct
    path: ./data/logs/*.ndjson
    time: ts
    indexes: [app, level]
  # endregion app_logs

  # region orders
  orders:
    time: created_at
    indexes: [status]
  # endregion orders

  # region outbox
  outbox:
    write: engine
    time: created_at
    indexes: [topic]
    durability: strict

  receipts:
    write: engine
  # endregion outbox

  # region sessions
  sessions:
    time: created_at
    expires_field: expires_at
  # endregion sessions
